# Juice Shop Authentication Specification
# This document defines authentication requirements and implementation guidelines

metadata:
  version: "1.0.0"
  last_updated: "2026-03-23"
  application: "Juice Shop"

authentication_flows:
  user_registration:
    requirements:
      - "Email verification required"
      - "Password strength validation"
      - "Rate limiting: 5 attempts per minute"
      - "CAPTCHA after 3 failed attempts"
      - "Account lockout after 10 failed attempts (30 minutes)"

    data_requirements:
      email:
        format: "email"
        unique: true
        verification: "required"

      password:
        min_length: 12
        complexity:
          uppercase: true
          lowercase: true
          numbers: true
          special_chars: true
        hashed: "bcrypt"
        salt_rounds: 12

      username:
        min_length: 3
        max_length: 30
        allowed_chars: "alphanumeric_underscore"
        unique: true

  user_login:
    requirements:
      - "Secure password verification"
      - "Session creation on success"
      - "Failed attempt logging"
      - "Rate limiting: 10 attempts per minute"
      - "Gradual delay backoff"

    security_measures:
      - "Prevent timing attacks"
      - "CSRF token generation"
      - "Secure session cookie"
      - "Remember me token (encrypted)"

  password_recovery:
    requirements:
      - "Email-based reset token"
      - "Token expiration: 1 hour"
      - "Single-use tokens"
      - "Rate limiting: 3 requests per hour"
      - "Secure password reset flow"

  multi_factor_auth:
    requirements:
      - "TOTP support (Google Authenticator)"
      - "Backup codes (10 codes)"
      - "SMS backup (if enabled)"
      - "Recovery keys"

    enforcement:
      mandatory_for: "admin_accounts"
      optional_for: "user_accounts"
      grace_period: "30_days"

session_management:
  configuration:
    cookie_name: "juice_shop_session"
    secret_key_rotation: "weekly"
    idle_timeout: "30_minutes"
    absolute_timeout: "8_hours"

  security_features:
    secure_flag: true
    http_only_flag: true
    same_site_policy: "Strict"
    session_regeneration: true
    concurrent_sessions: "max_3_per_user"

  session_storage:
    type: "database"
    encryption: "AES-256"
    ip_binding: true
    user_agent_binding: true

authorization_model:
  rbac_roles:
    guest:
      permissions:
        - "view_products"
        - "view_public_content"

    customer:
      inherits: "guest"
      permissions:
        - "place_orders"
        - "manage_profile"
        - "view_order_history"
        - "manage_wishlist"

    premium_customer:
      inherits: "customer"
      permissions:
        - "access_premium_features"
        - "bulk_orders"

    support:
      inherits: "premium_customer"
      permissions:
        - "view_all_orders"
        - "manage_customer_issues"

    admin:
      inherits: "support"
      permissions:
        - "manage_products"
        - "manage_users"
        - "view_analytics"
        - "system_configuration"

    super_admin:
      inherits: "admin"
      permissions:
        - "manage_admins"
        - "system_backup"
        - "security_settings"

  permission_enforcement:
    implementation: "attribute-based"
    deny_by_default: true
    resource_level_checks: true
    ownership_validation: true

api_authentication:
  jwt_tokens:
    algorithm: "RS256"
    key_rotation: "monthly"
    expiration:
      access_token: "15_minutes"
      refresh_token: "7_days"
      remember_me_token: "30_days"

    claims:
      required:
        - "sub"
        - "iat"
        - "exp"
        - "role"
      optional:
        - "permissions"
        - "session_id"

  api_keys:
    key_management:
      generation: "cryptographically_secure"
      rotation: "quarterly"
      revocation: "immediate"

    ratelimiting:
      default: "100_requests_per_hour"
      premium: "1000_requests_per_hour"
      admin: "unlimited"

security_headers:
  required_headers:
    - "Strict-Transport-Security: max-age=31536000; includeSubDomains; preload"
    - "X-Content-Type-Options: nosniff"
    - "X-Frame-Options: DENY"
    - "X-XSS-Protection: 1; mode=block"
    - "Referrer-Policy: strict-origin-when-cross-origin"
    - "Content-Security-Policy: default-src 'self'"
    - "Permissions-Policy: geolocation=(), microphone=(), camera=()"

password_policy:
  complexity_requirements:
    min_length: 12
    max_length: 128
    uppercase_letters: 1
    lowercase_letters: 1
    numbers: 1
    special_characters: 1

  forbidden_patterns:
    - "common_passwords"
    - "sequential_characters"
    - "repeated_characters"
    - "user_information"

  password_history:
    previous_passwords: 5
    similarity_threshold: 80

  expiration_policy:
    max_age_days: 90
    warning_days: 7
    grace_logins: 3

account_security:
  failed_login_handling:
    lockout_threshold: 5
    lockout_duration: "30_minutes"
    progressive_lockout: true
    notification_required: true

  account_recovery:
    email_verification: true
    security_questions: false
    backup_codes: true
    admin_override: true

  user activity_logging:
    login_attempts: true
    password_changes: true
    profile_modifications: true
    permission_changes: true
    api_access: true

compliance_requirements:
  standards:
    - "OWASP Authentication Cheat Sheet"
    - "NIST SP 800-63B"
    - "ISO 27001 A.9.2"
    - "PCI DSS Requirement 8"

  audit_requirements:
    - "Authentication event logging"
    - "Failed attempt monitoring"
    - "Account change tracking"
    - "Permission modification audit"

  data_protection:
    -PII encryption: "required"
    -Password hashing: "bcrypt/scrypt/argon2"
    -Session data encryption: "required"
    -Audit log integrity: "required"