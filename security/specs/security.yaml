# Juice Shop Security Specification
# This document defines the security requirements and controls for the OWASP Juice Shop application

metadata:
  version: "1.0.0"
  last_updated: "2026-03-23"
  framework: "OWASP ASVS Level 2"
  application: "Juice Shop"

security_objectives:
  primary:
    - "Preive authentication bypass"
    - "Protect against injection attacks"
    - "Implement proper authorization controls"
    - "Secure sensitive data handling"
    - "Prevent XSS and CSRF vulnerabilities"

  secondary:
    - "Ensure secure configuration"
    - "Implement proper logging and monitoring"
    - "Validate all inputs and outputs"
    - "Protect against business logic flaws"

threat_model:
  primary_threats:
    - "SQL Injection"
    - "Cross-Site Scripting (XSS)"
    - "Broken Authentication"
    - "Sensitive Data Exposure"
    - "Broken Access Control"
    - "Security Misconfiguration"
    - "Cross-Site Request Forgery (CSRF)"
    - "Insecure Deserialization"
    - "Using Components with Known Vulnerabilities"
    - "Insufficient Logging & Monitoring"

security_controls:
  authentication:
    password_policy:
      min_length: 12
      require_uppercase: true
      require_lowercase: true
      require_numbers: true
      require_special_chars: true
      password_history: 5
      max_age_days: 90

    session_management:
      timeout_minutes: 30
      secure_flag: true
      http_only_flag: true
      same_site_policy: "Strict"
      regenerate_on_login: true

  authorization:
    principle: "Deny by default"
    role_based_access: true
    least_privilege: true
    resource_level_checks: true

  input_validation:
    approach: "Allow-list only"
    server_side_validation: true
    client_side_validation: false
    encoding: "UTF-8"

  output_encoding:
    context_aware: true
    html_entities: true
    json_encoding: true
    url_encoding: true

  data_protection:
    encryption_at_rest: true
    encryption_in_transit: true
    algorithm: "AES-256-GCM"
    key_management: "AWS KMS"

  logging:
    level: "INFO"
    include_timestamp: true
    include_user_context: true
    include_source_ip: true
    log_rotation: true
    retention_days: 90

compliance:
  standards:
    - "OWASP Top 10 2021"
    - "OWASP ASVS Level 2"
    - "NIST Cybersecurity Framework"
    - "GDPR (for EU users)"
    - "PCI DSS (if handling payments)"

security_testing:
  types:
    - "Static Application Security Testing (SAST)"
    - "Dynamic Application Security Testing (DAST)"
    - "Interactive Application Security Testing (IAST)"
    - "Penetration Testing"
    - "Code Review"

  frequency:
    sast: "on_commit"
    dast: "daily"
    penetration_test: "quarterly"
    code_review: "on_pull_request"

incident_response:
  response_team:
    - "Security Lead"
    - "Development Lead"
    - "Operations Lead"
    - "Legal/Compliance"

  escalation_matrix:
    critical: "1_hour"
    high: "4_hours"
    medium: "24_hours"
    low: "72_hours"

security_metrics:
  key_indicators:
    - "Mean Time to Detect (MTTD)"
    - "Mean Time to Respond (MTTR)"
    - "Vulnerability Density"
    - "Security Test Coverage"
    - "Critical Vulnerability Age"

  targets:
    mttt_target: "24_hours"
    mttr_target: "48_hours"
    vulnerability_density_target: "<1_per_KLOC"
    security_coverage_target: ">80%"